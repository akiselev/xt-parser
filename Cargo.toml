[package]
name = "xt-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Evidence-driven native Rust parser for Parasolid XT"
license = "MIT OR Apache-2.0"

[workspace]
resolver = "3"
members = ["crates/xt-schema", "crates/xt-schema-gen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "xt-inspect"
path = "src/bin/xt-inspect.rs"

[[bin]]
name = "xt-schema"
path = "src/bin/xt-schema.rs"

[[bin]]
name = "xt-parse"
path = "src/bin/xt-parse.rs"

[[bin]]
name = "xt-corpus"
path = "src/bin/xt-corpus.rs"
